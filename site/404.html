<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#0b1211">
  <title>页面不存在 · CSMP</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1211;color:#edf3ea;font:15px/1.7 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}.card{width:min(560px,calc(100% - 36px));padding:36px;border:1px solid rgba(225,239,221,.14);border-radius:16px;background:linear-gradient(145deg,#17231e,#101815)}.mark{color:#c7f36b;font-size:12px;font-weight:800;letter-spacing:.18em}h1{margin:28px 0 8px;font-size:36px;letter-spacing:-.05em}p{margin:0;color:#a6b4aa}.code{margin-top:8px;color:#c7f36b;font:12px ui-monospace,monospace}.back{display:inline-flex;margin-top:27px;padding:10px 15px;border-radius:8px;background:#c7f36b;color:#14200d;font-weight:750;text-decoration:none}.back:focus-visible{outline:2px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">CSMP / 404</div>
    <h1>这里没有这个页面。</h1>
    <p>地址可能已更改，或页面暂时不可用。</p>
    <div class="code">NOT FOUND · 404</div>
    <a class="back" href="https://csmp.si/">返回首页</a>
  </main>
</body>
</html>
