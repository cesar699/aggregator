name: csmp-free-nodes

services:
  aggregate:
    build:
      context: ..
      dockerfile: free-nodes/Dockerfile
    image: csmp-free-nodes:local
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      MIHOMO_BIN: /usr/local/bin/mihomo
      SINGBOX_BIN: /usr/local/bin/sing-box
    volumes:
      - ./data:/data
    command:
      - python
      - free-nodes/run.py
      - --publish
      - local
      - --out
      - /data/run
      - --publish-dir
      - /data/published

  # Serves free-nodes/data/published as public subscription URLs.
  # DOMAIN comes from free-nodes/.env (see .env.example). A real domain
  # gets automatic HTTPS; use http://IP:8080 for a plain-HTTP test.
  # This service only reads the published directory; it never runs the
  # pipeline. Start it with: docker compose up -d web
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in free-nodes/.env (see .env.example)}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/published:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
