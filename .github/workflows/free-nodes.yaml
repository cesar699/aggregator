name: Free Nodes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# The failure-alert step creates issues; without this the default token
# may not have issues:write and the alert silently never fires.
permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: free-nodes
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run offline regression tests
        run: python -m unittest discover -s free-nodes -p 'test_*.py' -v

      - name: Make Mihomo executable
        run: chmod +x clash/clash-linux-amd

      - name: Download sing-box
        run: |
          curl --fail -sSL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          /tmp/sing-box-1.14.3-linux-amd64/sing-box version

      - name: Run aggregation pipeline
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SINGBOX_BIN: /tmp/sing-box-1.14.3-linux-amd64/sing-box
        run: python free-nodes/run.py --out out

      - name: Validate outputs
        run: python free-nodes/validate.py --dir out --mihomo-bin clash/clash-linux-amd --singbox-bin /tmp/sing-box-1.14.3-linux-amd64/sing-box

      - name: Upload outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-nodes-out
          path: out/
          retention-days: 7

      - name: Alert on 2 consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RUNS_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/free-nodes.yaml/runs?per_page=2&status=completed" --jq '.workflow_runs | map(.conclusion)')
          echo "Last 2 completed conclusions: $RUNS_JSON"
          PREV=$(echo "$RUNS_JSON" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r[0] if len(r)>0 else 'none')")
          if [ "$PREV" = "failure" ]; then
            # Don't spam a new issue for every further failure.
            OPEN=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" --jq '[.[] | select(.title=="free-nodes 连续失败 2 次，请检查")] | length')
            if [ "$OPEN" != "0" ]; then
              echo "An open alert issue already exists; skipping."
              exit 0
            fi
            gh api "repos/${{ github.repository }}/issues" \
              -f title="free-nodes 连续失败 2 次，请检查" \
              -f body="Free Nodes 工作流连续失败 2 次。

          - 仓库: ${{ github.repository }}
          - 本次运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 时间: $(date -u '+%Y-%m-%d %H:%M UTC')（Asia/Shanghai 约 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')）
          - 说明：Gist 未更新，订阅仍为上一次成功的结果。请检查 Actions 日志（节点源、Mihomo 检测或纯净度探测可能出了问题）。"
          else
            echo "Previous run did not fail (prev=$PREV); no issue created."
          fi
